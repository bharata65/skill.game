<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Puzzle Arena - Authentication</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/components.css">
</head>
<body>
    <div class="auth-container">
        
        <!-- Splash Screen -->
        <div id="splash-screen" class="auth-screen">
            <div class="splash-content">
                <div class="logo-circle">
                    <svg class="logo-icon" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                        <rect x="10" y="10" width="30" height="30" fill="#20c997" rx="4"/>
                        <rect x="60" y="10" width="30" height="30" fill="#20c997" rx="4"/>
                        <rect x="10" y="60" width="30" height="30" fill="#20c997" rx="4"/>
                        <rect x="60" y="60" width="30" height="30" fill="#20c997" rx="4"/>
                    </svg>
                </div>
                <h1 class="splash-title">Puzzle Arena</h1>
                <p class="splash-subtitle">Master Your Skills</p>
            </div>
        </div>

        <!-- Login Screen -->
        <div id="login-screen" class="auth-screen hidden">
            <div class="auth-content">
                <h2 class="auth-title">Login</h2>
                <p class="auth-subtitle">Welcome back to Puzzle Arena</p>

                <form id="login-form" class="auth-form">
                    <div class="form-group">
                        <label for="login-mobile" class="form-label">Mobile Number</label>
                        <input 
                            type="tel" 
                            id="login-mobile" 
                            class="form-input" 
                            placeholder="Enter your mobile number"
                            pattern="[0-9]{10}"
                            required
                        >
                        <span class="form-error" id="login-mobile-error"></span>
                    </div>

                    <div class="form-group">
                        <label for="login-password" class="form-label">Password</label>
                        <div class="password-field">
                            <input 
                                type="password" 
                                id="login-password" 
                                class="form-input" 
                                placeholder="Enter your password"
                                required
                            >
                            <button type="button" class="password-toggle" id="login-toggle-password">
                                <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                    <circle cx="12" cy="12" r="3"></circle>
                                </svg>
                            </button>
                        </div>
                        <span class="form-error" id="login-password-error"></span>
                    </div>

                    <button type="submit" class="btn btn-primary btn-full">Login</button>
                </form>

                <div class="auth-divider">or</div>

                <button type="button" class="btn btn-secondary btn-full" id="go-to-register">Create New Account</button>

                <div class="auth-footer">
                    <a href="#forgot-password" class="auth-link">Forgot password?</a>
                </div>
            </div>
        </div>

        <!-- Register Screen -->
        <div id="register-screen" class="auth-screen hidden">
            <div class="auth-content">
                <h2 class="auth-title">Sign Up</h2>
                <p class="auth-subtitle">Join Puzzle Arena today</p>

                <form id="register-form" class="auth-form">
                    <div class="form-group">
                        <label for="register-mobile" class="form-label">Mobile Number</label>
                        <input 
                            type="tel" 
                            id="register-mobile" 
                            class="form-input" 
                            placeholder="Enter your mobile number"
                            pattern="[0-9]{10}"
                            required
                        >
                        <span class="form-error" id="register-mobile-error"></span>
                    </div>

                    <div class="form-group">
                        <label for="register-password" class="form-label">Create Password</label>
                        <div class="password-field">
                            <input 
                                type="password" 
                                id="register-password" 
                                class="form-input" 
                                placeholder="Min 8 characters"
                                minlength="8"
                                required
                            >
                            <button type="button" class="password-toggle" id="register-toggle-password">
                                <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                    <circle cx="12" cy="12" r="3"></circle>
                                </svg>
                            </button>
                        </div>
                        <span class="form-error" id="register-password-error"></span>
                    </div>

                    <div class="form-group">
                        <label for="register-referral" class="form-label">Referral Code <span class="optional">(Optional)</span></label>
                        <input 
                            type="text" 
                            id="register-referral" 
                            class="form-input" 
                            placeholder="Enter referral code if you have one"
                        >
                        <span class="form-error" id="register-referral-error"></span>
                    </div>

                    <button type="submit" class="btn btn-primary btn-full">Register</button>
                </form>

                <div class="auth-divider">or</div>

                <button type="button" class="btn btn-secondary btn-full" id="go-to-login">Already have an account? Login</button>
            </div>
        </div>

        <!-- OTP Verification Screen -->
        <div id="otp-screen" class="auth-screen hidden">
            <div class="auth-content">
                <h2 class="auth-title">Verify OTP</h2>
                <p class="auth-subtitle" id="otp-subtitle">Enter the 6-digit code sent to your mobile</p>

                <form id="otp-form" class="auth-form">
                    <div class="otp-container">
                        <input type="text" class="otp-box" maxlength="1" pattern="[0-9]" inputmode="numeric" required>
                        <input type="text" class="otp-box" maxlength="1" pattern="[0-9]" inputmode="numeric" required>
                        <input type="text" class="otp-box" maxlength="1" pattern="[0-9]" inputmode="numeric" required>
                        <input type="text" class="otp-box" maxlength="1" pattern="[0-9]" inputmode="numeric" required>
                        <input type="text" class="otp-box" maxlength="1" pattern="[0-9]" inputmode="numeric" required>
                        <input type="text" class="otp-box" maxlength="1" pattern="[0-9]" inputmode="numeric" required>
                    </div>
                    <span class="form-error" id="otp-error"></span>

                    <button type="submit" class="btn btn-primary btn-full">Verify & Continue</button>
                </form>

                <div class="otp-footer">
                    <p class="otp-timer">Resend code in <span id="timer">60</span>s</p>
                    <button type="button" class="btn btn-link" id="resend-otp">Resend OTP</button>
                </div>
            </div>
        </div>

        <!-- Set 4-Digit Password Screen -->
        <div id="pin-screen" class="auth-screen hidden">
            <div class="auth-content">
                <h2 class="auth-title">Set Security PIN</h2>
                <p class="auth-subtitle">Create a 4-digit PIN for quick login</p>

                <form id="pin-form" class="auth-form">
                    <div class="pin-container">
                        <input type="text" class="pin-circle" maxlength="1" pattern="[0-9]" inputmode="numeric" required>
                        <input type="text" class="pin-circle" maxlength="1" pattern="[0-9]" inputmode="numeric" required>
                        <input type="text" class="pin-circle" maxlength="1" pattern="[0-9]" inputmode="numeric" required>
                        <input type="text" class="pin-circle" maxlength="1" pattern="[0-9]" inputmode="numeric" required>
                    </div>
                    <span class="form-error" id="pin-error"></span>

                    <button type="submit" class="btn btn-primary btn-full">Confirm PIN</button>
                </form>

                <div class="pin-footer">
                    <button type="button" class="btn btn-link" id="skip-pin">Skip for now</button>
                </div>
            </div>
        </div>

    </div>

    <script type="module" src="../js/auth/auth-manager.js"></script>
</body>
</html>
