<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ludo Skill Game - Play & Win</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        /* CSS Reset & Body Styling */
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #0d1117;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Mobile Container for Perfect Fitting */
        .mobile-container {
            max-width: 480px;
            width: 100%;
            background: radial-gradient(circle at top, #1f2937, #0d1117);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-sizing: border-box;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
            position: relative;
            overflow: hidden;
        }

        /* Ludo Themed Top Bar */
        .ludo-colors {
            display: flex;
            height: 6px;
            width: 100%;
        }
        .color-box { flex: 1; }
        .red { background: #ff3838; }
        .green { background: #3ae374; }
        .blue { background: #17c0eb; }
        .yellow { background: #fff200; }

        /* Header Section */
        .header {
            text-align: center;
            padding: 20px 10px 10px;
        }
        .header h1 {
            color: #fff;
            font-size: 32px;
            margin: 0;
            font-weight: 900;
            text-transform: uppercase;
            text-shadow: 2px 2px 8px rgba(255, 242, 0, 0.3);
        }
        .header h1 span { color: #fff200; }
        
        /* Dice Image or Emoji */
        .dice-icon {
            font-size: 60px;
            margin: 10px 0;
            animation: bounce 2s infinite ease-in-out;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        /* Countdown Timer Box */
        .timer-container {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            margin: 15px 20px;
            padding: 15px;
            text-align: center;
            backdrop-filter: blur(5px);
        }
        .timer-title {
            color: #c8d6e5;
            font-size: 14px;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .timer {
            font-size: 40px;
            font-weight: 900;
            color: #ff3838;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(255, 56, 56, 0.6);
        }

        /* Main Play Button */
        .cta-section {
            text-align: center;
            padding: 20px;
            margin-top: 10px;
        }
        .play-btn {
            display: inline-block;
            width: 100%;
            padding: 22px 0;
            font-size: 28px;
            font-weight: 900;
            color: #fff;
            background: linear-gradient(45deg, #ff3838, #ff9f1a);
            border: none;
            border-radius: 50px;
            text-decoration: none;
            text-transform: uppercase;
            box-shadow: 0 10px 25px rgba(255, 56, 56, 0.5);
            animation: pulse 1.5s infinite;
            transition: all 0.2s ease;
            cursor: pointer;
        }
        .play-btn:active {
            transform: scale(0.95);
            box-shadow: 0 5px 15px rgba(255, 56, 56, 0.5);
        }

        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 56, 56, 0.7); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 20px rgba(255, 56, 56, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 56, 56, 0); }
        }

        /* Info Cards (Deposit / Withdrawal) */
        .info-grid {
            display: flex;
            gap: 15px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .info-card {
            flex: 1;
            background: #1e272e;
            padding: 15px 10px;
            border-radius: 12px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .info-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 4px;
        }
        .min-card::before { background: #3ae374; }
        .max-card::before { background: #17c0eb; }
        
        .info-card h3 {
            margin: 0;
            font-size: 13px;
            color: #808e9b;
            text-transform: uppercase;
        }
        .info-card p {
            margin: 8px 0 0;
            font-size: 20px;
            font-weight: 700;
            color: #fff;
        }
        .min-card p { color: #3ae374; }
        .max-card p { color: #17c0eb; }

    </style>
</head>
<body>

    <div class="mobile-container">
        
        <div class="ludo-colors">
            <div class="color-box red"></div>
            <div class="color-box green"></div>
            <div class="color-box yellow"></div>
            <div class="color-box blue"></div>
        </div>

        <div class="header">
            <div class="dice-icon">🎲</div>
            <h1>Ludo <span>Skill</span></h1>
            <p style="color: #d2dae2; margin-top: 5px; font-size: 14px;">Play Games & Earn Real Cash Daily!</p>
        </div>

        <div class="timer-container">
            <div class="timer-title">Special Offer Ends In</div>
            <div class="timer" id="countdown">01:00</div>
        </div>

        <div class="cta-section">
            <a href="https://bharata65.github.io/skill.game/" class="play-btn" id="playBtn">PLAY NOW</a>
        </div>

        <div class="info-grid">
            <div class="info-card min-card">
                <h3>Min Deposit &<br>Withdrawal</h3>
                <p>₹100</p>
            </div>
            <div class="info-card max-card">
                <h3>Maximum<br>Withdrawal</h3>
                <p>₹50,000</p>
            </div>
        </div>

    </div>

    <script>
        // 1 Minute Countdown Timer Logic
        let timeLeft = 60; // 60 seconds
        const countdownElement = document.getElementById('countdown');
        const playBtn = document.getElementById('playBtn');

        const timer = setInterval(() => {
            timeLeft--;
            
            // Format time as MM:SS
            let minutes = Math.floor(timeLeft / 60);
            let seconds = timeLeft % 60;
            
            minutes = minutes < 10 ? "0" + minutes : minutes;
            seconds = seconds < 10 ? "0" + seconds : seconds;
            
            countdownElement.textContent = `${minutes}:${seconds}`;

            // Add extra animation when timer is less than 10 seconds
            if(timeLeft <= 10) {
                countdownElement.style.color = "#fff200"; // changes color to yellow to show urgency
            }

            // Action when timer hits zero
            if (timeLeft <= 0) {
                clearInterval(timer);
                countdownElement.textContent = "00:00";
                countdownElement.style.color = "#ff3838";
                
                // Optional: You can change the button text when time is up
                // playBtn.textContent = "JOIN FAST!";
            }
        }, 1000);
    </script>

</body>
</html>
