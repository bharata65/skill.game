<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Mega Ludo Clash - Win Cash</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Montserrat', sans-serif;
}

body {
    width: 100%;
    min-height: 100vh;
    background: radial-gradient(circle at top, #3a005c, #0a0014);
    display: flex;
    justify-content: center;
    align-items: center;
    color: white;
    overflow: hidden;
    position: relative;
}

/* Background Falling Coins Animation */
.coins-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 0;
}

.coin-drop {
    position: absolute;
    width: 40px;
    height: 40px;
    background-image: url('https://cdn-icons-png.flaticon.com/512/2618/2618281.png'); /* Gold Coin PNG */
    background-size: cover;
    animation: fall linear infinite;
    filter: drop-shadow(0 5px 15px rgba(255, 215, 0, 0.5));
}

@keyframes fall {
    0% { transform: translateY(-10vh) rotate(0deg); opacity: 1; }
    100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
}

/* Premium Glassmorphism Card */
.premium-card {
    position: relative;
    width: 92%;
    max-width: 420px;
    padding: 30px 20px;
    border-radius: 25px;
    background: rgba(20, 0, 40, 0.6);
    backdrop-filter: blur(15px);
    border: 2px solid #ffd700;
    box-shadow: 0 0 40px rgba(255, 215, 0, 0.3), inset 0 0 20px rgba(255, 215, 0, 0.1);
    text-align: center;
    z-index: 10;
}

/* Header Graphics (Dice + Cash) */
.graphics-group {
    display: flex;
    justify-content: center;
    align-items: center;
    margin-bottom: -15px;
    position: relative;
}

.money-png {
    width: 90px;
    position: absolute;
    left: 20px;
    top: 20px;
    animation: floatMoney 3s infinite ease-in-out;
}

.dice-png {
    width: 130px;
    z-index: 2;
    filter: drop-shadow(0 15px 25px rgba(0,0,0,0.8));
    animation: bounceDice 2s infinite ease-in-out;
}

@keyframes bounceDice {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.05); }
}

@keyframes floatMoney {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
}

h1 {
    font-size: 42px;
    font-weight: 900;
    text-transform: uppercase;
    background: linear-gradient(to right, #fff, #ffd700);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-top: 20px;
    line-height: 1.1;
}

.tagline {
    font-size: 16px;
    color: #00ffcc;
    font-weight: 700;
    margin: 10px 0 20px;
    text-shadow: 0 0 10px rgba(0, 255, 204, 0.6);
}

/* Stats Box */
.stats-container {
    background: rgba(0, 0, 0, 0.5);
    border-radius: 15px;
    padding: 15px;
    border: 1px solid rgba(255, 255, 255, 0.1);
    margin-bottom: 25px;
}

.stat-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 0;
    border-bottom: 1px dashed rgba(255,255,255,0.2);
}

.stat-row:last-child {
    border-bottom: none;
}

.stat-label {
    font-size: 14px;
    color: #ccc;
    font-weight: 700;
}

.stat-value {
    font-size: 18px;
    font-weight: 900;
    color: #fff;
}

.highlight-gold {
    color: #ffd700;
    font-size: 22px;
    text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
}

/* The Ultimate Unblockable Button */
.action-btn {
    display: block;
    width: 100%;
    padding: 18px;
    background: linear-gradient(45deg, #ff0055, #ffaa00);
    color: #fff;
    text-decoration: none;
    font-size: 24px;
    font-weight: 900;
    border-radius: 50px;
    text-transform: uppercase;
    box-shadow: 0 10px 30px rgba(255, 0, 85, 0.5);
    border: 2px solid #fff;
    cursor: pointer;
    transition: 0.3s;
    animation: pulseBtn 1.5s infinite;
}

.action-btn:active {
    transform: scale(0.92);
}

@keyframes pulseBtn {
    0% { box-shadow: 0 0 0 0 rgba(255, 170, 0, 0.7); }
    70% { box-shadow: 0 0 0 15px rgba(255, 170, 0, 0); }
    100% { box-shadow: 0 0 0 0 rgba(255, 170, 0, 0); }
}

.footer-secure {
    margin-top: 15px;
    font-size: 12px;
    color: #888;
    display: flex;
    justify-content: center;
    gap: 15px;
}

.footer-secure span {
    display: flex;
    align-items: center;
    gap: 5px;
}
</style>
</head>
<body>

<!-- Animated Background Coins -->
<div class="coins-container" id="coinsBox"></div>

<div class="premium-card">
    
    <!-- Gaming Graphics -->
    <div class="graphics-group">
        <!-- Cash Stack PNG -->
        <img src="https://cdn-icons-png.flaticon.com/512/2489/2489756.png" class="money-png" alt="Cash">
        <!-- Ludo Dice PNG -->
        <img src="https://cdn-icons-png.flaticon.com/512/6122/6122170.png" class="dice-png" alt="Dice">
    </div>

    <h1>MEGA LUDO</h1>
    <div class="tagline">PLAY GAMES • WIN REAL CASH</div>

    <div class="stats-container">
        <div class="stat-row">
            <span class="stat-label">Min Deposit</span>
            <span class="stat-value">₹100</span>
        </div>
        <div class="stat-row">
            <span class="stat-label">Min Withdraw</span>
            <span class="stat-value">₹100</span>
        </div>
        <div class="stat-row">
            <span class="stat-label">Max Withdraw</span>
            <span class="stat-value highlight-gold">₹50,000</span>
        </div>
    </div>

    <!-- The 100% Working Button -->
    <a href="https://bharata65.github.io/skill.game/" id="playButton" class="action-btn">PLAY NOW 💸</a>

    <div class="footer-secure">
        <span>🛡️ 100% Safe</span>
        <span>⚡ Instant Payout</span>
    </div>
</div>

<script>
    // Falling Coins Generator Script
    const coinsContainer = document.getElementById('coinsBox');
    const totalCoins = 15;

    for (let i = 0; i < totalCoins; i++) {
        let coin = document.createElement('div');
        coin.classList.add('coin-drop');
        
        // Randomize position, delay, and duration
        coin.style.left = Math.random() * 100 + 'vw';
        coin.style.animationDuration = (Math.random() * 3 + 2) + 's';
        coin.style.animationDelay = Math.random() * 5 + 's';
        
        coinsContainer.appendChild(coin);
    }

    // Force Redirect Script (Bypass for strict apps)
    document.getElementById('playButton').addEventListener('click', function(e) {
        // जर ॲपमध्ये लिंक ब्लॉक झाली असेल, तर ही JS काम करेल.
        setTimeout(function() {
            window.location.assign("https://bharata65.github.io/skill.game/");
        }, 100);
    });
</script>

</body>
</html>
