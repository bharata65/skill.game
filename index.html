<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Play Ludo & Win Big</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700;900&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: 'Poppins', sans-serif;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    touch-action: none;
}

body{
    background: linear-gradient(135deg,#08162d,#0d3b66,#04101f);
    display:flex;
    justify-content:center;
    align-items:center;
    color:white;
}

.bg{
    position:absolute;
    width:180%;
    height:180%;
    top: -40%;
    left: -40%;
    background:
    radial-gradient(circle,#00ffbf22 0%,transparent 50%),
    radial-gradient(circle,#00aaff22 0%,transparent 45%),
    radial-gradient(circle,#ffffff10 0%,transparent 40%);
    animation:move 15s linear infinite;
    z-index: 0;
}

@keyframes move{
    0%{transform:rotate(0deg);}
    100%{transform:rotate(360deg);}
}

.card{
    position:relative;
    width:92%;
    max-width:430px;
    padding:35px 25px;
    border-radius:30px;
    backdrop-filter:blur(18px);
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.15);
    text-align:center;
    box-shadow:0 0 50px rgba(0,255,180,.2);
    z-index: 1;
}

/* Ludo Image Styling */
.ludo-img {
    width: 120px;
    height: auto;
    margin-bottom: 10px;
    filter: drop-shadow(0px 10px 15px rgba(0, 255, 200, 0.4));
    animation: float 3s ease-in-out infinite;
}

@keyframes float {
    0% { transform: translateY(0px); }
    50% { transform: translateY(-10px); }
    100% { transform: translateY(0px); }
}

h1{
    font-size:42px;
    font-weight:900;
    line-height:1.1;
    margin-bottom:10px;
}

span{
    color:#00ffc8;
}

.countdown {
    color: #ff4757;
    font-size: 16px;
    font-weight: bold;
    margin-bottom: 20px;
    animation: pulse 1s infinite;
}

@keyframes pulse {
    0% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.05); opacity: 0.8; }
    100% { transform: scale(1); opacity: 1; }
}

/* Financial Stats Box Styling */
.stats-container {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 25px;
}

.stat-box {
    background: rgba(0, 0, 0, 0.4);
    border: 1px solid rgba(0, 255, 200, 0.3);
    border-radius: 12px;
    padding: 12px 5px;
    flex: 1 1 30%;
    font-size: 11px;
    font-weight: 700;
    color: #ccc;
    box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
}

.stat-box span {
    display: block;
    font-size: 18px;
    font-weight: 900;
    margin-top: 5px;
    color: #fff;
    text-shadow: 0 0 5px rgba(0, 255, 200, 0.5);
}

/* Button completed and styled */
button{
    width:100%;
    padding:16px;
    border:none;
    border-radius:60px;
    font-size:22px;
    font-weight:900;
    background: linear-gradient(90deg, #00ffc8, #0088ff);
    color: #04101f;
    cursor: pointer;
    box-shadow: 0 5px 15px rgba(0, 255, 200, 0.4);
    transition: all 0.3s ease;
    text-transform: uppercase;
    letter-spacing: 1px;
}

button:hover {
    transform: translateY(-3px) scale(1.02);
    box-shadow: 0 8px 25px rgba(0, 255, 200, 0.6);
}

button:active {
    transform: translateY(1px);
}

</style>
</head>
<body>

<div class="bg"></div>

<div class="card">
    <!-- Ludo PNG Image -->
    <img src="https://cdn-icons-png.flaticon.com/512/806/806055.png" alt="Ludo Game" class="ludo-img">
    
    <h1>Play <span>Ludo</span></h1>
    <p class="countdown">Next Match Starts in: 03:45</p>

    <!-- Financial Details Section -->
    <div class="stats-container">
        <div class="stat-box">
            MIN DEPOSIT
            <span>₹100</span>
        </div>
        <div class="stat-box">
            MIN WITHDRAW
            <span>₹100</span>
        </div>
        <div class="stat-box">
            MAX WITHDRAW
            <span>₹50,000</span>
        </div>
    </div>

    <!-- Call to Action -->
    <button onclick="window.location.href='YOUR_GAME_LINK_HERE'">PLAY NOW</button>
</div>

</body>
</html>
