<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <!-- Mobile fitted & Non-Zoomable Meta Tag -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ludo Master - Play Now</title>
    <style>
        /* Base Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: radial-gradient(circle at center, #2b1055, #000000);
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            overflow: hidden; /* Prevents scrolling */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            touch-action: manipulation; /* Prevents double-tap zoom on mobiles */
        }

        /* 3D Floating Animation */
        @keyframes float {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-25px) rotate(15deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }

        /* Glowing Pulse Animation for Button */
        @keyframes pulseGlow {
            0% { transform: scale(1); box-shadow: 0 0 15px #ff007a, 0 0 30px #ff007a; }
            50% { transform: scale(1.05); box-shadow: 0 0 30px #ff007a, 0 0 60px #ff007a; }
            100% { transform: scale(1); box-shadow: 0 0 15px #ff007a, 0 0 30px #ff007a; }
        }

        /* Background Ludo Graphic */
        .ludo-bg {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 350px;
            height: 350px;
            background: url('https://cdn-icons-png.flaticon.com/512/2002/2002511.png') no-repeat center center;
            background-size: contain;
            opacity: 0.15;
            z-index: 0;
            animation: float 8s ease-in-out infinite;
            filter: drop-shadow(0 0 20px rgba(255, 255, 255, 0.2));
        }

        /* Floating Elements Container */
        .floating-graphics {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none; /* Allows clicking through */
            z-index: 1;
        }

        .graphic-item {
            position: absolute;
            font-size: 3.5rem;
            animation: float 4s ease-in-out infinite;
            filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.8));
        }

        .dice-1 { top: 15%; left: 10%; animation-delay: 0s; font-size: 4rem; }
        .dice-2 { top: 65%; right: 10%; animation-delay: 1.5s; font-size: 5rem; }
        .token-1 { bottom: 20%; left: 15%; animation-delay: 2.5s; color: #ff004c; text-shadow: 0 0 10px red; }
        .token-2 { top: 25%; right: 15%; animation-delay: 1s; color: #00ff88; text-shadow: 0 0 10px green; }

        /* Main Content UI */
        .ui-container {
            position: relative;
            z-index: 10;
            text-align: center;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 40px 30px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            width: 90%;
            max-width: 400px;
        }

        h1 {
            font-size: 2.8rem;
            font-weight: 900;
            text-transform: uppercase;
            background: linear-gradient(45deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }

        p.subtitle {
            font-size: 1.1rem;
            color: #b3c0d1;
            margin-bottom: 35px;
            font-weight: 500;
        }

        /* Advanced Play Button */
        .play-now-btn {
            display: inline-block;
            padding: 18px 50px;
            font-size: 1.6rem;
            font-weight: 800;
            color: #ffffff;
            background: linear-gradient(90deg, #ff007a, #7000ff);
            text-decoration: none;
            border-radius: 50px;
            border: 2px solid transparent;
            cursor: pointer;
            animation: pulseGlow 2s infinite;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .play-now-btn:active {
            transform: scale(0.92) !important;
            box-shadow: 0 0 10px #ff007a;
        }
    </style>
</head>
<body>

    <!-- Center Ludo Watermark Background -->
    <div class="ludo-bg"></div>

    <!-- Floating Graphics (Dice and Tokens) -->
    <div class="floating-graphics">
        <div class="graphic-item dice-1">🎲</div>
        <div class="graphic-item dice-2">🎲</div>
        <div class="graphic-item token-1">♟️</div>
        <div class="graphic-item token-2">♟️</div>
    </div>

    <!-- Glassmorphism Container -->
    <div class="ui-container">
        <h1>Ludo King</h1>
        <p class="subtitle">Play & Win Big Today</p>
        
        <!-- Action Button (Redirect to your link) -->
        <a href="https://bharata65.github.io/skill.game/" class="play-now-btn">Play Now</a>
    </div>

</body>
</html>
