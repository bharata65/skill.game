<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ludo - Play, Enjoy, Win</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html, body {
            width: 100%;
            height: 100vh;
            overflow: hidden; /* Scroll complete band kel aahe */
            font-family: 'Poppins', sans-serif;
            background-color: #020617;
            background-image: radial-gradient(circle at center, #1e3a8a 0%, #020617 90%);
            color: white;
        }

        /* 3D LUDO Title */
        .ludo-title {
            font-family: 'Montserrat', sans-serif;
            font-size: 3.2rem;
            font-weight: 900;
            line-height: 1;
            display: flex;
            justify-content: center;
            gap: 2px;
            filter: drop-shadow(0 10px 10px rgba(0,0,0,0.6));
        }

        .ludo-letter {
            text-transform: uppercase;
        }
        .letter-L { color: #ff0000; -webkit-text-stroke: 1.5px #ffb3b3; text-shadow: 0px 3px 0px #cc0000, 0px 6px 0px #800000; }
        .letter-U { color: #0088ff; -webkit-text-stroke: 1.5px #b3ddff; text-shadow: 0px 3px 0px #0066cc, 0px 6px 0px #003366; }
        .letter-D { color: #00cc00; -webkit-text-stroke: 1.5px #b3ffb3; text-shadow: 0px 3px 0px #009900, 0px 6px 0px #004d00; }
        .letter-O { color: #ffcc00; -webkit-text-stroke: 1.5px #ffebb3; text-shadow: 0px 3px 0px #cca300, 0px 6px 0px #806600; }

        /* Ribbon */
        .ribbon {
            background: linear-gradient(to bottom, #d90000, #800000);
            border: 1.5px solid #ffcc00;
            border-radius: 4px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        /* Play Now Button */
        .btn-play-now {
            background: linear-gradient(to bottom, #00ff00, #008000);
            border: 3px solid #b3ffb3;
            box-shadow: 
                inset 0px 4px 8px rgba(255,255,255,0.5),
                0px 6px 0px #004d00,
                0px 10px 15px rgba(0,0,0,0.6);
            text-shadow: 1px 2px 2px rgba(0,0,0,0.5);
            transition: all 0.1s ease;
            animation: pulse 1.5s infinite;
        }

        .btn-play-now:active {
            transform: translateY(6px);
            box-shadow: 
                inset 0px 2px 4px rgba(255,255,255,0.5),
                0px 0px 0px #004d00,
                0px 3px 5px rgba(0,0,0,0.6);
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.02); }
            100% { transform: scale(1); }
        }

        /* Compact Ludo Board */
        .ludo-board-css {
            background: #fff;
            border: 6px solid #5a3a22;
            border-radius: 8px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.8);
            width: 170px;
            height: 170px;
            display: grid;
            grid-template-columns: 2fr 1fr 2fr;
            grid-template-rows: 2fr 1fr 2fr;
            gap: 1px;
            background-color: #ccc;
            transform: perspective(600px) rotateX(10deg);
        }
        
        .ludo-home { display: flex; align-items: center; justify-content: center; padding: 4px; }
        .ludo-home-inner { width: 70%; height: 70%; background: #fff; border-radius: 4px; display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; }
        .ludo-home-inner span { background: currentColor; border-radius: 50%; }
        
        .ludo-red { background-color: #ff0000; color: #ff0000; }
        .ludo-green { background-color: #00cc00; color: #00cc00; }
        .ludo-blue { background-color: #0088ff; color: #0088ff; }
        .ludo-yellow { background-color: #ffcc00; color: #ffcc00; }

        .ludo-path { display: grid; background: #fff; }
        .ludo-path-v { grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(6, 1fr); background: #999; gap: 0.5px; }
        .ludo-path-h { grid-template-columns: repeat(6, 1fr); grid-template-rows: repeat(3, 1fr); background: #999; gap: 0.5px; }
        .path-cell { background: #fff; }
        
        .center-home {
            width: 0; height: 0; 
            border-left: 18px solid #00cc00;
            border-right: 18px solid #0088ff;
            border-top: 18px solid #ff0000;
            border-bottom: 18px solid #ffcc00;
            margin: auto;
        }

        .info-card {
            background: linear-gradient(145deg, #0f172a, #020617);
            border: 1.5px solid;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
        }
    </style>
</head>
<body class="flex flex-col items-center justify-between p-3">

    <!-- Top Section: Title & Subtitle -->
    <div class="w-full text-center flex flex-col items-center">
        <div class="ludo-title mt-1">
            <span class="ludo-letter letter-L">L</span>
            <span class="ludo-letter letter-U">U</span>
            <span class="ludo-letter letter-D">D</span>
            <span class="ludo-letter letter-O">O</span>
        </div>

        <div class="ribbon px-6 py-0.5 mt-1 mb-1.5">
            <h2 class="text-white text-xs font-bold tracking-widest" style="font-family: 'Montserrat', sans-serif;">
                PLAY &bull; ENJOY &bull; WIN
            </h2>
        </div>

        <p class="text-white font-semibold text-xs sm:text-sm">
            Play Ludo Online & Win Real Rewards
        </p>
        <p class="text-yellow-400 font-bold text-xs">
            Real Players. Real Fun. Real Cash.
        </p>
    </div>

    <!-- Middle Section: Timer & Ludo Board -->
    <div class="flex flex-col items-center w-full my-1">
        <!-- Timer -->
        <div class="bg-red-600 border border-red-400 rounded-full px-4 py-1 mb-2 shadow-[0_0_10px_rgba(220,38,38,0.7)]">
            <p class="text-white font-bold text-xs text-center flex items-center gap-1.5">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
                <span id="timerText">Joining Closes In: <span id="timeDisplay">01:00</span></span>
            </p>
        </div>

        <!-- Mini Board -->
        <div class="ludo-board-css">
            <div class="ludo-home ludo-red"><div class="ludo-home-inner"><span></span><span></span><span></span><span></span></div></div>
            <div class="ludo-path ludo-path-v">
                <div class="path-cell"></div><div class="path-cell"></div><div class="path-cell"></div>
                <div class="path-cell"></div><div class="path-cell ludo-blue"></div><div class="path-cell ludo-blue"></div>
                <div class="path-cell"></div><div class="path-cell ludo-blue"></div><div class="path-cell"></div>
                <div class="path-cell"></div><div class="path-cell ludo-blue"></div><div class="path-cell"></div>
                <div class="path-cell"></div><div class="path-cell ludo-blue"></div><div class="path-cell"></div>
                <div class="path-cell"></div><div class="path-cell ludo-blue"></div><div class="path-cell"></div>
            </div>
            <div class="ludo-home ludo-blue"><div class="ludo-home-inner"><span></span><span></span><span></span><span></span></div></div>
            
            <div class="ludo-path ludo-path-h">
                <div class="path-cell"></div><div class="path-cell ludo-red"></div><div class="path-cell"></div><div class="path-cell"></div><div class="path-cell"></div><div class="path-cell"></div>
                <div class="path-cell"></div><div class="path-cell ludo-red"></div><div class="path-cell ludo-red"></div><div class="path-cell ludo-red"></div><div class="path-cell ludo-red"></div><div class="path-cell ludo-red"></div>
                <div class="path-cell"></div><div class="path-cell"></div><div class="path-cell"></div><div class="path-cell"></div><div class="path-cell"></div><div class="path-cell"></div>
            </div>
            <div class="flex items-center justify-center bg-gray-200"><div class="center-home"></div></div>
            <div class="ludo-path ludo-path-h">
                <div class="path-cell"></div><div class="path-cell"></div><div class="path-cell"></div><div class="path-cell"></div><div class="path-cell"></div><div class="path-cell"></div>
                <div class="path-cell ludo-yellow"></div><div class="path-cell ludo-yellow"></div><div class="path-cell ludo-yellow"></div><div class="path-cell ludo-yellow"></div><div class="path-cell ludo-yellow"></div><div class="path-cell"></div>
                <div class="path-cell"></div><div class="path-cell"></div><div class="path-cell"></div><div class="path-cell"></div><div class="path-cell ludo-yellow"></div><div class="path-cell"></div>
            </div>

            <div class="ludo-home ludo-green"><div class="ludo-home-inner"><span></span><span></span><span></span><span></span></div></div>
            <div class="ludo-path ludo-path-v">
                <div class="path-cell"></div><div class="path-cell ludo-green"></div><div class="path-cell"></div>
                <div class="path-cell"></div><div class="path-cell ludo-green"></div><div class="path-cell"></div>
                <div class="path-cell"></div><div class="path-cell ludo-green"></div><div class="path-cell"></div>
                <div class="path-cell"></div><div class="path-cell ludo-green"></div><div class="path-cell"></div>
                <div class="path-cell ludo-green"></div><div class="path-cell ludo-green"></div><div class="path-cell"></div>
                <div class="path-cell"></div><div class="path-cell"></div><div class="path-cell"></div>
            </div>
            <div class="ludo-home ludo-yellow"><div class="ludo-home-inner"><span></span><span></span><span></span><span></span></div></div>
        </div>
    </div>

    <!-- Info Cards -->
    <div class="grid grid-cols-3 gap-2 w-full max-w-sm px-1">
        <div class="info-card border-green-600 rounded-lg p-1.5 text-center">
            <span class="text-[9px] font-bold text-gray-300 block">MIN DEPOSIT</span>
            <span class="text-sm font-bold text-green-400">₹100</span>
        </div>
        <div class="info-card border-blue-600 rounded-lg p-1.5 text-center">
            <span class="text-[9px] font-bold text-gray-300 block">MIN WITHDRAW</span>
            <span class="text-sm font-bold text-blue-300">₹100</span>
        </div>
        <div class="info-card border-yellow-600 rounded-lg p-1.5 text-center">
            <span class="text-[9px] font-bold text-gray-300 block">MAX WITHDRAW</span>
            <span class="text-sm font-bold text-yellow-400">₹50,000</span>
        </div>
    </div>

    <!-- Bottom Section: Play Now Button & Footer -->
    <div class="w-full max-w-sm flex flex-col items-center pb-1">
        <!-- Play Now Button -->
        <button onclick="startGame()" class="btn-play-now w-full rounded-2xl py-3 text-white text-3xl font-black cursor-pointer uppercase tracking-wider my-2" style="font-family: 'Montserrat', sans-serif;">
            PLAY NOW
        </button>

        <!-- Features Bar -->
        <div class="w-full bg-slate-900 border border-slate-700 rounded-lg p-1.5 flex justify-around items-center text-center">
            <div class="text-[9px] font-bold text-white">🎮 PLAY ONLINE</div>
            <div class="text-[9px] font-bold text-white">🔒 100% SAFE</div>
            <div class="text-[9px] font-bold text-white">🏆 WIN BIG</div>
        </div>

        <!-- Footer Tag -->
        <div class="text-[9px] text-yellow-500 font-bold mt-1 text-center">
            FAIR PLAY &nbsp;|&nbsp; SAFE & SECURE &nbsp;|&nbsp; INSTANT WITHDRAWALS
        </div>
    </div>

    <!-- Script -->
    <script>
        // 1 Minute Timer Logic
        let timeLeft = 60;
        const timeDisplay = document.getElementById('timeDisplay');
        const timerText = document.getElementById('timerText');

        const countdown = setInterval(() => {
            timeLeft--;
            let minutes = Math.floor(timeLeft / 60);
            let seconds = timeLeft % 60;
            timeDisplay.textContent = `0${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;

            if (timeLeft <= 0) {
                clearInterval(countdown);
                timerText.innerHTML = "Join Now! Time's Up.";
            }
        }, 1000);

        // Proper Redirection Function
        function startGame() {
            window.location.href = 'https://bharata65.github.io/skill.game/';
        }
    </script>
</body>
</html>
