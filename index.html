<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>APNA LUDO</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            background: #020617;
            font-family: Arial, Helvetica, sans-serif;
        }

        .landing-page {
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;

            background-image:
                linear-gradient(
                    to bottom,
                    rgba(0, 0, 0, 0.02) 50%,
                    rgba(0, 0, 0, 0.35) 78%,
                    rgba(0, 0, 0, 0.88) 100%
                ),
                url("images/dhoni.jpg");

            background-size: cover;
            background-position: center top;
            background-repeat: no-repeat;

            padding: 20px 18px 30px;
        }

        .register-btn {
            width: 100%;
            max-width: 620px;

            display: flex;
            align-items: center;
            justify-content: center;

            min-height: 78px;
            padding: 18px 25px;

            border-radius: 18px;

            text-decoration: none;

            font-size: clamp(25px, 6vw, 48px);
            font-weight: 900;
            letter-spacing: 1px;

            color: #06152d;

            background:
                linear-gradient(
                    180deg,
                    #fff36a 0%,
                    #ffd51a 38%,
                    #ffad00 100%
                );

            border: 3px solid #fff4a3;

            box-shadow:
                0 0 0 3px rgba(255, 174, 0, 0.35),
                0 10px 35px rgba(255, 174, 0, 0.45),
                inset 0 3px 0 rgba(255, 255, 255, 0.8),
                inset 0 -5px 0 rgba(180, 90, 0, 0.25);

            text-shadow:
                0 1px 0 rgba(255,255,255,0.5);

            transition:
                transform 0.15s ease,
                box-shadow 0.15s ease;
        }

        .register-btn:hover {
            transform: scale(1.025);

            box-shadow:
                0 0 0 3px rgba(255, 214, 30, 0.5),
                0 15px 45px rgba(255, 174, 0, 0.65),
                inset 0 3px 0 rgba(255, 255, 255, 0.9),
                inset 0 -5px 0 rgba(180, 90, 0, 0.25);
        }

        .register-btn:active {
            transform: scale(0.97);
        }

        @media (max-width: 600px) {

            .landing-page {
                padding: 15px 12px 20px;

                background-position:
                    center top;
            }

            .register-btn {
                min-height: 68px;
                border-radius: 15px;
                border-width: 2px;
            }
        }
    </style>
</head>

<body>

    <main class="landing-page">

        <!--
            IMAGE PATH:
            images/dhoni.jpg

            तुमचा Dhoni image या path वर ठेवा:
            project/
            ├── index.html
            └── images/
                └── dhoni.jpg
        -->

        <a
            class="register-btn"
            href="https://apnaludo.in/referral/PD1116"
        >
            REGISTER NOW
        </a>

    </main>

</body>
</html>
