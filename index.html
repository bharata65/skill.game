<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Play Ludo & Win</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700;900&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Poppins', sans-serif;
}

html, body {
    width: 100%;
    min-height: 100vh;
    background: linear-gradient(135deg, #08162d, #0d3b66, #04101f);
    display: flex;
    justify-content: center;
    align-items: center;
    color: white;
    overflow-x: hidden;
    touch-action: pan-y;
}

.bg {
    position: fixed;
    width: 180%;
    height: 180%;
    top: -40%;  
    left: -40%;
    background:
        radial-gradient(circle, #00ffbf22 0%, transparent 50%),
        radial-gradient(circle, #00aaff22 0%, transparent 45%),
        radial-gradient(circle, #ffffff10 0%, transparent 40%);
    animation: move 15s linear infinite;
    z-index: 0;
}

@keyframes move {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}

.card {
    position: relative;
    width: 92%;
    max-width: 430px;
    padding: 35px 25px;
    margin: 20px 0;
    border-radius: 30px;
    backdrop-filter: blur(18px);
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.15);
    text-align: center;
    box-shadow: 0 0 50px rgba(0, 255, 180, 0.2);
    z-index: 1; 
}

/* 🎲 Emoji Logo */
.hero-emoji {
    font-size: 100px;
    line-height: 1;
    margin: -10px auto 15px;
    display: block;
    filter: drop-shadow(0px 10px 25px rgba(0,0,0,0.6));
    animation: float 3s ease-in-out infinite;
}

@keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-15px); }
}

h1 {
    font-size: 46px;
    font-weight: 900;
    line-height: 1.1;
    text-shadow: 2px 2px 10px rgba(0,0,0,0.5);
}

h1 span {
    color: #00ffc8;
    text-shadow: 0 0 15px rgba(0, 255, 200, 0.6);
}

p.subtitle {
    margin: 15px 0 20px;
    font-size: 16px;
    opacity: 0.9;
    letter-spacing: 1px;
}

.countdown-box {
    background: rgba(255, 71, 87, 0.15);
    border: 1px solid #ff4757;
    border-radius: 12px;
    padding: 10px;
    margin-bottom: 25px;
}

.countdown {
    color: #ff4757;
    font-size: 20px;
    font-weight: 900;
    animation: pulse 1s infinite;
}

@keyframes pulse {
    0% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.05); opacity: 0.8; }
    100% { transform: scale(1); opacity: 1; }
}

.info-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    margin-bottom: 25px;
}

.info-item {
    background: rgba(0, 0, 0, 0.4);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 15px;
    padding: 12px 5px;
}

.info-item.full-width {
    grid-column: span 2;
    background: linear-gradient(90deg, rgba(255,215,0,0.1), rgba(255,215,0,0.05));
    border-color: rgba(255, 215, 0, 0.3);
}

.info-title {
    font-size: 12px;
    color: #a0aec0;
    text-transform: uppercase;
    font-weight: 700;
}

.info-amount {
    font-size: 22px;
    font-weight: 900;
    color: #ffffff;
    margin-top: 5px;
}

.info-item.full-width .info-amount {
    color: #ffd700;
    text-shadow: 0 0 10px rgba(255, 215, 0, 0.4);
}

/* एकदम साधा आणि परफेक्ट चालणारा Button Code */
.play-btn {
    display: block; 
    width: 100%;
    padding: 18px;
    background: linear-gradient(90deg, #00ffc8, #00aaff);
    color: #04101f;
    text-decoration: none; 
    border-radius: 60px;
    font-size: 24px;
    font-weight: 900;
    text-transform: uppercase;
    text-align: center;
    box-shadow: 0 10px 25px rgba(0, 255, 200, 0.4);
    position: relative;
    z-index: 9999; 
}

.play-btn:active {
    transform: scale(0.95);
    filter: brightness(1.1);
}

.trust-badges {
    display: flex;
    justify-content: center;
    gap: 15px;
    margin-top: 20px;
    font-size: 12px;
    color: #a0aec0;
    font-weight: 700;
}

.trust-badges span {
    display: flex;
    align-items: center;
    gap: 5px;
}
</style>
</head>
<body>

<div class="bg"></div>

<div class="card">
    
    <div class="hero-emoji">🎲</div>
    
    <h1>PLAY <span>LUDO</span></h1>
    <p class="subtitle">Show Your Skills & Win Cash!</p>

    <div class="countdown-box">
        <div class="countdown" id="timer">Offer Ends In: 01:00</div>
    </div>

    <div class="info-grid">
        <div class="info-item">
            <div class="info-title">Min Deposit</div>
            <div class="info-amount">₹100</div>
        </div>
        <div class="info-item">
            <div class="info-title">Min Withdraw</div>
            <div class="info-amount">₹100</div>
        </div>
        <div class="info-item full-width">
            <div class="info-title">Maximum Withdrawal</div>
            <div class="info-amount">₹50,000</div>
        </div>
    </div>

    <!-- एकदम क्लीन HTML लिंक (कोणतीही JavaScript नाही) -->
    <a href="https://bharata65.github.io/skill.game/" class="play-btn">PLAY NOW 🚀</a>

    <div class="trust-badges">
        <span>🔒 100% SECURE</span>
        <span>⚡ FAST WITHDRAWAL</span>
    </div>
</div>

<script>
    // फक्त टायमरसाठी स्क्रिप्ट 
    let timeLeft = 60; 
    const timerElement = document.getElementById('timer');

    const countdownInterval = setInterval(() => {
        timeLeft--;
        
        let minutes = Math.floor(timeLeft / 60);
        let seconds = timeLeft % 60;
        
        if (seconds < 10) {
            seconds = '0' + seconds;
        }

        timerElement.innerHTML = `Offer Ends In: 0${minutes}:${seconds}`;

        if (timeLeft <= 0) {
            clearInterval(countdownInterval);
            timerElement.innerHTML = "Hurry Up! Join Now";
            timerElement.style.color = "#00ffc8"; 
        }
    }, 1000);
</script>

</body>
</html>
