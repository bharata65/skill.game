<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <!-- Fully Mobile Fitted & Non-Zoomable Meta Tag -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ludo Master - Play Now</title>
    <style>
        /* Base Reset & Full Screen Lock */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            background: radial-gradient(circle at center, #1b0c3a, #05020a);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            touch-action: manipulation;
        }

        /* Background Animated Glow Elements */
        .bg-glow {
            position: absolute;
            width: 300px;
            height: 300px;
            background: linear-gradient(180deg, #ff007a, #7000ff);
            filter: blur(80px);
            opacity: 0.3;
            z-index: 0;
            animation: pulseBg 4s ease-in-out infinite alternate;
        }

        @keyframes pulseBg {
            0% { transform: scale(0.9); opacity: 0.2; }
            100% { transform: scale(1.2); opacity: 0.4; }
        }

        /* Floating Dice/Token 3D Animations */
        @keyframes floatAnim {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(10deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }

        .floating-container {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 1;
        }

        .floating-item {
            position: absolute;
            font-size: 3.5rem;
            animation: floatAnim 4s ease-in-out infinite;
            filter: drop-shadow(0 10px 10px rgba(0,0,0,0.5));
        }

        .item-1 { top: 12%; left: 8%; animation-delay: 0s; }
        .item-2 { bottom: 15%; right: 8%; animation-delay: 1.5s; font-size: 4.5rem; }
        .item-3 { top: 20%; right: 10%; animation-delay: 0.8s; color: #ff0055; }

        /* Main Glassmorphism UI Box (Mothi ani Mobile Fitted) */
        .main-card {
            position: relative;
            z-index: 10;
            width: 92%;
            max-width: 420px;
            padding: 45px 25px;
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1.5px solid rgba(255, 255, 255, 0.15);
            border-radius: 30px;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.7);
        }

        /* Ludo Logo Icon inside card */
        .game-icon {
            width: 90px;
            height: 90px;
            margin: 0 auto 20px auto;
            background: url('https://cdn-icons-png.flaticon.com/512/2002/2002511.png') no-repeat center center;
            background-size: contain;
            filter: drop-shadow(0 0 15px rgba(255, 0, 122, 0.6));
            animation: floatAnim 3s ease-in-out infinite;
        }

        /* Big Heading */
        h1 {
            font-size: 2.8rem;
            font-weight: 900;
            text-transform: uppercase;
            background: linear-gradient(to right, #ff9966, #ff5e62);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        /* Subtitle */
        p.sub-text {
            font-size: 1.15rem;
            color: #d1d8e0;
            margin-bottom: 35px;
            font-weight: 500;
        }

        /* Big Working Play Now Button */
        .play-btn {
            display: block;
            width: 100%;
            padding: 20px 0;
            font-size: 1.8rem;
            font-weight: 800;
            text-transform: uppercase;
            color: #ffffff;
            background: linear-gradient(135deg, #00b09b, #96c93d);
            background: linear-gradient(135deg, #ff0844, #ffb199);
            border: none;
            border-radius: 50px;
            text-decoration: none;
            box-shadow: 0 10px 30px rgba(255, 8, 68, 0.5);
            transition: all 0.2s ease-in-out;
            letter-spacing: 2px;
            cursor: pointer;
        }

        /* Button Click Effect (Active State) */
        .play-btn:active {
            transform: scale(0.95);
            box-shadow: 0 5px 15px rgba(255, 8, 68, 0.8);
        }
    </style>
</head>
<body>

    <!-- Background Design Glow -->
    <div class="bg-glow"></div>

    <!-- Floating Emojis -->
    <div class="floating-container">
        <div class="floating-item item-1">🎲</div>
        <div class="floating-item item-2">🎲</div>
        <div class="floating-item item-3">👑</div>
    </div>

    <!-- Central UI Card -->
    <div class="main-card">
        <div class="game-icon"></div>
        <h1>Ludo Master</h1>
        <p class="sub-text">Tap Play Now & Start Winning!</p>
        
        <!-- Direct Working Link Button -->
        <a href="https://bharata65.github.io/skill.game/" class="play-btn">Play Now</a>
    </div>

</body>
</html>
