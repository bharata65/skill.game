<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ludo - Play, Enjoy, Win</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }
        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden; /* Scroll complete band kel ahe */
            font-family: 'Poppins', sans-serif;
            background-color: #020617;
            background-image: radial-gradient(circle at center, #1e3a8a 0%, #020617 90%);
            color: white;
        }

        .bg-stars {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: 
                radial-gradient(2px 2px at 20px 30px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 40px 70px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 90px 40px, #ffffff, rgba(0,0,0,0));
            background-size: 150px 150px;
            opacity: 0.2;
            z-index: -1;
        }

        /* 3D LUDO Text - Motha size */
        .ludo-title {
            font-family: 'Montserrat', sans-serif;
            font-size: 3.8rem;
            font-weight: 900;
            line-height: 1;
            display: flex;
            justify-content: center;
            gap: 4px;
        }

        .ludo-letter {
            text-transform: uppercase;
        }

        .letter-L { color: #ff0000; -webkit-text-stroke: 2px #ffb3b3; text-shadow: 0px 4px 0px #990000, 0px 8px 12px rgba(0,0,0,0.8); }
        .letter-U { color: #0088ff; -webkit-text-stroke: 2px #b3ddff; text-shadow: 0px 4px 0px #0044cc, 0px 8px 12px rgba(0,0,0,0.8); }
        .letter-D { color: #00cc00; -webkit-text-stroke: 2px #b3ffb3; text-shadow: 0px 4px 0px #006600, 0px 8px 12px rgba(0,0,0,0.8); }
        .letter-O { color: #ffcc00; -webkit-text-stroke: 2px #ffebb3; text-shadow: 0px 4px 0px #b38f00, 0px 8px 12px rgba(0,0,0,0.8); }

        /* Ribbon */
        .ribbon {
            background: linear-gradient(to bottom, #e60000, #800000);
            border: 2px solid #ffcc00;
            border-radius: 6px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.6);
        }
        
        /* Play Now Button - Motha ani Attractive */
        .btn-play-now {
            background: linear-gradient(to bottom, #00ff00, #007700);
            border: 3px solid #b3ffb3;
            box-shadow: 
                inset 0px 4px 8px rgba(255,255,255,0.6),
                0px 6px 0px #004d00,
                0px 10px 15px rgba(0,0,0,0.7);
            text-shadow: 0px 2px 4px rgba(0,0,0,0.6);
            animation: pulseGlow 1.5s infinite alternate;
        }

        .btn-play-now:active {
            transform: translateY(6px);
            box-shadow: 
                inset 0px 2px 4px rgba(255,255,255,0.6),
                0px 0px 0px #004d00,
                0px 3px 5px rgba(0,0,0,0.7);
        }

        @keyframes pulseGlow {
            0% { transform: scale(1); filter: brightness(1); }
            100% { transform: scale(1.02); filter: brightness(1.1); }
        }

        /* Ludo Board Mini CSS */
        .ludo-board-css {
            background: #fff;
            border: 6px solid #5a3a22;
            border-radius: 8px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.8);
            width: 180px;
            height: 180px;
            display: grid;
            grid-template-columns: 2fr 1fr 2fr;
            grid-template-rows: 2fr 1fr 2fr;
            gap: 1px;
            padding: 3px;
            background-color: #ccc;
            transform: perspective(600px) rotateX(10deg);
        }
        
        .ludo-home { border: 1px solid #000; border-radius: 4px; display: flex; align-items: center; justify-content: center; }
        .ludo-home-inner { width: 65%; height: 65%; background: #fff; border-radius: 3px; display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; }
        .ludo-home-inner span { background: currentColor; border-radius: 50%; }
        
        .ludo-red { background-color: #ff0000; }
        .ludo-green { background-color: #00cc00; }
        .ludo-blue { background-color: #0088ff; }
        .ludo-yellow { background-color: #ffcc00; }
        .path-cell { background: #fff; }
        .ludo-path { display: grid; background: #fff; }
        .ludo-path-v { grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(6, 1fr); gap: 0.5px; background: #bbb; }
        .ludo-path-h { grid-template-columns: repeat(6, 1fr); grid-template-rows: repeat(3, 1fr); gap: 0.5px; background: #bbb; }
        
        .center-home {
            width: 0; height: 0; 
            border-left: 18px solid #00cc00;
            border-right: 18px solid #0088ff;
            border-top: 18px solid #ff0000;
            border-bottom: 18px solid #ffcc00;
            margin: auto;
        }

        .info-card {
            background: linear-gradient(145deg, #0f172a, #020617);
            border: 2px solid;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body class="flex flex-col items-center justify-between px-3 py-3 w-full h-full">
    <div class="bg-stars"></div>

    <!-- Top Ludo Title & Ribbon -->
    <div class="flex flex-col items-center w-full">
        <div class="ludo-title">
            <span class="ludo-letter letter-L">L</span>
            <span class="ludo-letter letter-U">U</span>
            <span class="ludo-letter letter-D">D</span>
            <span class="ludo-letter letter-O">O</span>
        </div>

        <div class="ribbon px-6 py-0.5 mt-1">
            <h2 class="text-white text-sm font-extrabold tracking-widest text-center" style="font-family: 'Montserrat', sans-serif;">
                PLAY &bull; ENJOY &bull; WIN
            </h2>
        </div>
    </div>

    <!-- Subtitles & 1 Min Timer -->
    <div class="flex flex-col items-center w-full my-1">
        <p class="text-center text-white font-bold text-sm">Play Ludo Online & Win Real Rewards</p>
        <p class="text-center text-yellow-400 font-extrabold text-xs mb-1.5">Real Players. Real Fun. Real Cash.</p>
        
        <!-- Timer Badge -->
        <div class="bg-red-600 border border-red-400 rounded-full px-4 py-0.5 shadow-[0_0_10px_rgba(220,38,38,0.8)] flex items-center gap-1.5">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-white animate-spin" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            <span class="text-white font-bold text-xs" id="timerText">Joining Timer: <span id="timeDisplay" class="text-yellow-300">01:00</span></span>
        </div>
    </div>

    <!-- Ludo Board Center Piece -->
    <div class="flex justify-center items-center my-1">
        <div class="ludo-board-css">
            <div class="ludo-home ludo-red"><div class="ludo-home-inner text-red-500"><span></span><span></span><span></span><span></span></div></div>
            <div class="ludo-path ludo-path-v">
                <div class="path-cell"></div><div class="path-cell"></div><div class="path-cell"></div>
                <div class="path-cell"></div><div class="path-cell ludo-blue"></div><div class="path-cell ludo-blue"></div>
                <div class="path-cell"></div><div class="path-cell ludo-blue"></div><div class="path-cell"></div>
                <div class="path-cell"></div><div class="path-cell ludo-blue"></div><div class="path-cell"></div>
                <div class="path-cell"></div><div class="path-cell ludo-blue"></div><div class="path-cell"></div>
                <div class="path-cell"></div><div class="path-cell ludo-blue"></div><div class="path-cell"></div>
            </div>
            <div class="ludo-home ludo-blue"><div class="ludo-home-inner text-blue-500"><span></span><span></span><span></span><span></span></div></div>
            
            <div class="ludo-path ludo-path-h">
                <div class="path-cell"></div><div class="path-cell ludo-red"></div><div class="path-cell"></div><div class="path-cell"></div><div class="path-cell"></div><div class="path-cell"></div>
                <div class="path-cell"></div><div class="path-cell ludo-red"></div><div class="path-cell ludo-red"></div><div class="path-cell ludo-red"></div><div class="path-cell ludo-red"></div><div class="path-cell ludo-red"></div>
                <div class="path-cell"></div><div class="path-cell"></div><div class="path-cell"></div><div class="path-cell"></div><div class="path-cell"></div><div class="path-cell"></div>
            </div>
            <div class="flex items-center justify-center bg-gray-200"><div class="center-home"></div></div>
            <div class="ludo-path ludo-path-h">
                <div class="path-cell"></div><div class="path-cell"></div><div class="path-cell"></div><div class="path-cell"></div><div class="path-cell"></div><div class="path-cell"></div>
                <div class="path-cell ludo-yellow"></div><div class="path-cell ludo-yellow"></div><div class="path-cell ludo-yellow"></div><div class="path-cell ludo-yellow"></div><div class="path-cell ludo-yellow"></div><div class="path-cell"></div>
                <div class="path-cell"></div><div class="path-cell"></div><div class="path-cell"></div><div class="path-cell"></div><div class="path-cell ludo-yellow"></div><div class="path-cell"></div>
            </div>

            <div class="ludo-home ludo-green"><div class="ludo-home-inner text-green-500"><span></span><span></span><span></span><span></span></div></div>
            <div class="ludo-path ludo-path-v">
                <div class="path-cell"></div><div class="path-cell ludo-green"></div><div class="path-cell"></div>
                <div class="path-cell"></div><div class="path-cell ludo-green"></div><div class="path-cell"></div>
                <div class="path-cell"></div><div class="path-cell ludo-green"></div><div class="path-cell"></div>
                <div class="path-cell"></div><div class="path-cell ludo-green"></div><div class="path-cell"></div>
                <div class="path-cell ludo-green"></div><div class="path-cell ludo-green"></div><div class="path-cell"></div>
                <div class="path-cell"></div><div class="path-cell"></div><div class="path-cell"></div>
            </div>
            <div class="ludo-home ludo-yellow"><div class="ludo-home-inner text-yellow-500"><span></span><span></span><span></span><span></span></div></div>
        </div>
    </div>

    <!-- Info Cards (Deposit / Withdrawal) -->
    <div class="grid grid-cols-3 gap-2 w-full max-w-sm">
        <div class="info-card border-green-600 rounded-lg p-1.5 flex flex-col items-center text-center">
            <span class="text-[9px] font-bold text-gray-300">MIN DEPOSIT</span>
            <span class="text-sm font-extrabold text-green-400">₹100</span>
        </div>
        <div class="info-card border-blue-600 rounded-lg p-1.5 flex flex-col items-center text-center">
            <span class="text-[9px] font-bold text-gray-300">MIN WITHDRAW</span>
            <span class="text-sm font-extrabold text-blue-300">₹100</span>
        </div>
        <div class="info-card border-yellow-600 rounded-lg p-1.5 flex flex-col items-center text-center">
            <span class="text-[9px] font-bold text-gray-300">MAX WITHDRAW</span>
            <span class="text-sm font-extrabold text-yellow-400">₹50,000</span>
        </div>
    </div>

    <!-- Play Now Button (Redirect Link Added) -->
    <div class="w-full max-w-sm my-1">
        <button onclick="startGame()" class="btn-play-now w-full rounded-full py-3 px-4 text-white text-3xl font-black tracking-wider cursor-pointer" style="font-family: 'Montserrat', sans-serif;">
            PLAY NOW
        </button>
    </div>

    <!-- Footer Features & Security Tags -->
    <div class="w-full max-w-sm bg-slate-900 border border-slate-700 rounded-lg py-1.5 px-2 flex justify-around items-center text-center">
        <div class="flex flex-col items-center">
            <span class="text-[10px] font-bold text-white">PLAY ONLINE</span>
            <span class="text-[7px] text-gray-400">REAL PLAYERS</span>
        </div>
        <div class="h-4 w-[1px] bg-slate-700"></div>
        <div class="flex flex-col items-center">
            <span class="text-[10px] font-bold text-white">100% SAFE</span>
            <span class="text-[7px] text-gray-400">SECURE GAMES</span>
        </div>
        <div class="h-4 w-[1px] bg-slate-700"></div>
        <div class="flex flex-col items-center">
            <span class="text-[10px] font-bold text-white">WIN BIG</span>
            <span class="text-[7px] text-gray-400">CASH REWARDS</span>
        </div>
    </div>

    <!-- Bottom Fair Play Text -->
    <div class="text-center w-full pb-1">
        <span class="text-yellow-500 text-[9px] font-bold tracking-wide">
            FAIR PLAY &nbsp;|&nbsp; <span class="text-green-400">SAFE & SECURE</span> &nbsp;|&nbsp; <span class="text-yellow-400">INSTANT WITHDRAWALS</span>
        </span>
    </div>

    <!-- JavaScript for 1 Min Timer and Target Redirection -->
    <script>
        // 1 Minute Timer Logic
        let timeLeft = 60;
        const timeDisplay = document.getElementById('timeDisplay');
        const timerText = document.getElementById('timerText');

        const countdown = setInterval(() => {
            timeLeft--;
            let minutes = Math.floor(timeLeft / 60);
            let seconds = timeLeft % 60;
            timeDisplay.textContent = `0${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;

            if (timeLeft <= 0) {
                clearInterval(countdown);
                timerText.innerHTML = "Hurry up! Join now.";
            }
        }, 1000);

        // Play Now Button Click Redirect Function
        function startGame() {
            window.location.href = 'https://akadda.net/signup?refer=0rj82766';
        }
    </script>
</body>
</html>
