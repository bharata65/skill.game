<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Mobile fitted and non-zoomable configuration -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Play Ludo Online</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
            /* Disable text selection and highlight on mobile */
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            /* Advanced animated Ludo theme colors gradient */
            background: linear-gradient(-45deg, #ff0044, #0044ff, #00cc44, #ffcc00);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            color: white;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Glassmorphism Card Effect */
        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 25px;
            padding: 40px 20px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
            position: relative;
            z-index: 10;
        }

        /* Floating Ludo Image */
        .logo {
            width: 140px;
            margin-bottom: 15px;
            filter: drop-shadow(0px 15px 15px rgba(0,0,0,0.4));
            animation: floatLogo 3s ease-in-out infinite;
        }

        .title {
            font-size: 2.2em;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 5px;
            text-shadow: 2px 3px 5px rgba(0,0,0,0.5);
        }

        .subtitle {
            font-size: 0.95em;
            font-weight: 400;
            margin-bottom: 30px;
            color: #f0f0f0;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.5);
        }

        /* Play Now Button with Glow */
        .play-btn {
            display: inline-block;
            background: linear-gradient(90deg, #ff8a00, #e52e71);
            color: white;
            text-decoration: none;
            font-size: 1.4em;
            font-weight: 700;
            padding: 16px 45px;
            border-radius: 50px;
            box-shadow: 0 10px 25px rgba(229, 46, 113, 0.6);
            transition: all 0.3s ease;
            text-transform: uppercase;
            border: 2px solid rgba(255, 255, 255, 0.4);
            animation: pulseBtn 2s infinite;
        }

        .play-btn:active {
            transform: scale(0.92);
            box-shadow: 0 5px 15px rgba(229, 46, 113, 0.4);
        }

        /* Animations */
        @keyframes pulseBtn {
            0% { transform: scale(1); box-shadow: 0 10px 25px rgba(229, 46, 113, 0.6); }
            50% { transform: scale(1.05); box-shadow: 0 15px 35px rgba(229, 46, 113, 0.8); }
            100% { transform: scale(1); box-shadow: 0 10px 25px rgba(229, 46, 113, 0.6); }
        }

        @keyframes floatLogo {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-12px); }
            100% { transform: translateY(0px); }
        }

        /* Background Dice Elements */
        .dice {
            position: absolute;
            font-size: 4rem;
            filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.4));
            z-index: 1;
            animation: spinFloat 6s linear infinite;
        }

        .dice-1 { top: 10%; left: 5%; animation-duration: 7s; }
        .dice-2 { bottom: 15%; right: 5%; animation-duration: 5s; animation-direction: reverse; }
        .dice-3 { top: 15%; right: 10%; font-size: 2.5rem; animation-duration: 8s; }
        .dice-4 { bottom: 10%; left: 10%; font-size: 3rem; animation-duration: 6s; }

        @keyframes spinFloat {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-30px) rotate(180deg); }
            100% { transform: translateY(0px) rotate(360deg); }
        }
    </style>
</head>
<body>

    <!-- Animated 3D/Emoji Dice Floating in Background -->
    <div class="dice dice-1">🎲</div>
    <div class="dice dice-2">🎲</div>
    <div class="dice dice-3">🎲</div>
    <div class="dice dice-4">🎲</div>

    <div class="container">
        <!-- Ludo PNG Image (Replace src with your own image if needed) -->
        <img src="https://cdn-icons-png.flaticon.com/512/806/806135.png" alt="Ludo Game" class="logo">
        
        <h1 class="title">Play Ludo</h1>
        <p class="subtitle">Roll the dice, make your move, and win!</p>
        
        <!-- Action Button with direct link -->
        <a href="https://bharata65.github.io/skill.game/" class="play-btn">Play Now</a>
    </div>

</body>
</html>
