<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LUDO - Play & Win Cash</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent; /* मोबाईलवर क्लिक केल्यावर येणारा निळा रंग काढण्यासाठी */
        }
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #0b0f19;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Mobile Container Perfect Fitting - Made Entirely Clickable */
        .mobile-container {
            max-width: 480px;
            width: 100%;
            background: radial-gradient(circle at top, #1e1b4b, #0b0f19);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.9);
            position: relative;
            overflow: hidden;
            cursor: pointer; /* पूर्ण स्क्रीन क्लिकेबल असल्याचे दाखवते */
        }
        
        .mobile-container:active {
            transform: scale(0.99); /* टच केल्यावर थोडासा इफेक्ट */
            transition: transform 0.1s;
        }

        /* Ludo Colors Top Strip */
        .ludo-colors {
            display: flex;
            height: 8px;
            width: 100%;
        }
        .color-box { flex: 1; }
        .red { background: #ef4444; }
        .green { background: #22c55e; }
        .yellow { background: #eab308; }
        .blue { background: #3b82f6; }

        /* Header Section - LUDO Word Extra Large */
        .header {
            text-align: center;
            padding: 25px 15px 10px;
        }
        .ludo-title {
            color: #ffffff;
            font-size: 55px;
            margin: 0;
            font-weight: 900;
            letter-spacing: 3px;
            text-transform: uppercase;
            text-shadow: 0 0 20px rgba(234, 179, 8, 0.6), 3px 3px 0px #ef4444;
        }
        .ludo-title span {
            color: #eab308;
            text-shadow: 0 0 20px rgba(234, 179, 8, 0.8), 3px 3px 0px #3b82f6;
        }
        
        .sub-heading {
            color: #94a3b8;
            font-size: 15px;
            margin-top: 8px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        /* Dice Bounce Animation */
        .dice-icon {
            font-size: 50px;
            margin: 5px 0;
            animation: bounce 1.8s infinite ease-in-out;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-12px) rotate(10deg); }
        }

        /* 1 Min Countdown Timer Box */
        .timer-container {
            background: rgba(255, 255, 255, 0.04);
            border: 1.5px dashed rgba(234, 179, 8, 0.4);
            border-radius: 16px;
            margin: 10px 20px;
            padding: 12px;
            text-align: center;
            backdrop-filter: blur(10px);
        }
        .timer-title {
            color: #cbd5e1;
            font-size: 13px;
            margin-bottom: 4px;
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 1px;
        }
        .timer {
            font-size: 38px;
            font-weight: 900;
            color: #ef4444;
            letter-spacing: 2px;
            text-shadow: 0 0 12px rgba(239, 68, 68, 0.7);
        }

        /* PLAY NOW Big Button */
        .cta-section {
            text-align: center;
            padding: 15px 20px;
        }
        .play-btn {
            display: block;
            width: 100%;
            padding: 20px 0;
            font-size: 28px;
            font-weight: 900;
            color: #ffffff;
            background: linear-gradient(135deg, #ef4444 0%, #f97316 50%, #eab308 100%);
            border: none;
            border-radius: 50px;
            text-transform: uppercase;
            box-shadow: 0 10px 30px rgba(239, 68, 68, 0.6);
            animation: pulse-animation 1.5s infinite;
            cursor: pointer;
            letter-spacing: 1px;
        }

        /* Button Click Effect */
        .play-btn:active {
            transform: scale(0.95);
            box-shadow: 0 5px 15px rgba(239, 68, 68, 0.8);
        }

        @keyframes pulse-animation {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.8); }
            70% { transform: scale(1.04); box-shadow: 0 0 0 18px rgba(239, 68, 68, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        /* Info Cards (Deposit & Withdrawal) */
        .info-grid {
            display: flex;
            gap: 12px;
            padding: 0 20px 20px;
        }
        .info-card {
            flex: 1;
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 14px 10px;
            border-radius: 14px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .info-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 4px;
        }
        .min-card::before { background: #22c55e; }
        .max-card::before { background: #3b82f6; }
        
        .info-card h3 {
            margin: 0;
            font-size: 12px;
            color: #94a3b8;
            text-transform: uppercase;
            font-weight: 700;
        }
        .info-card p {
            margin: 6px 0 0;
            font-size: 21px;
            font-weight: 900;
        }
        .min-card p { color: #22c55e; }
        .max-card p { color: #3b82f6; }

        /* Footer trust text */
        .footer-text {
            text-align: center;
            color: #64748b;
            font-size: 11px;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <!-- इथे JS चा 'onclick' लावला आहे, ज्यामुळे संपूर्ण स्क्रीन क्लिकेबल झाली आहे -->
    <div class="mobile-container" onclick="window.location.href='https://bharata65.github.io/skill.game/'">
        
        <!-- कलरफुल Ludo पट्टी -->
        <div class="ludo-colors">
            <div class="color-box red"></div>
            <div class="color-box green"></div>
            <div class="color-box yellow"></div>
            <div class="color-box blue"></div>
        </div>

        <!-- हेडर सेक्शन - मोठा LUDO शब्द -->
        <div class="header">
            <div class="dice-icon">🎲</div>
            <h1 class="ludo-title">LU<span>DO</span></h1>
            <div class="sub-heading">⚡ Instant Withdrawal Ludo Game ⚡</div>
        </div>

        <!-- 1 मिनिटाचा काउंटडाऊन टाइमर -->
        <div class="timer-container">
            <div class="timer-title">🔥 Bonus Offer Expiring In 🔥</div>
            <div class="timer" id="countdown">01:00</div>
        </div>

        <!-- प्ले नाऊ बटन - इथेही JS चा 'onclick' लावला आहे -->
        <div class="cta-section">
            <button class="play-btn" onclick="window.location.href='https://bharata65.github.io/skill.game/'">PLAY NOW</button>
        </div>

        <!-- माहिती (डिपॉझिट आणि विथड्रॉवल) -->
        <div class="info-grid">
            <div class="info-card min-card">
                <h3>Min Deposit & Win</h3>
                <p>₹100</p>
            </div>
            <div class="info-card max-card">
                <h3>Max Withdrawal</h3>
                <p>₹50,000</p>
            </div>
        </div>

        <div class="footer-text">100% Safe & Secure Platform</div>

    </div>

    <script>
        // अचूक 1 मिनिट (60 सेकंद) काउंटडाऊन लॉजिक
        let timeLeft = 60;
        const countdownElement = document.getElementById('countdown');

        const timer = setInterval(() => {
            timeLeft--;
            
            let minutes = Math.floor(timeLeft / 60);
            let seconds = timeLeft % 60;
            
            minutes = minutes < 10 ? "0" + minutes : minutes;
            seconds = seconds < 10 ? "0" + seconds : seconds;
            
            countdownElement.textContent = `${minutes}:${seconds}`;

            if(timeLeft <= 10) {
                countdownElement.style.color = "#eab308"; // शेवटी पिवळा रंग होईल
            }

            if (timeLeft <= 0) {
                clearInterval(timer);
                countdownElement.textContent = "00:00";
                timeLeft = 60; // टाइमर संपल्यावर पुन्हा रिसेट होईल (ऑटो लूप)
            }
        }, 1000);
    </script>

</body>
</html>
